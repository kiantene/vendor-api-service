before_script:
  - export JAVA_HOME=/usr/lib/jvm/jdk-18/

variables:
  DOCKERHUB_URL: 634937900606.dkr.ecr.ap-east-1.amazonaws.com
  DOCKERHUB_USERNAME: AWS
  STG_POINTING_BRANCH: staging
  STG_DOCKER_REGISTRY: esportsking/ga-vendor-api-service
  STG_DOCKER_TAG: stg
  STG_PORTAINER_NAME: game-aggregator_ga-vendor-api-service
  STG_SERVER: ubuntu@16.163.185.163
  STG2_SERVER: ubuntu@16.163.242.71
  STG3_SERVER_1: ubuntu@16.163.195.191
  STG3_SERVER_2: ubuntu@18.163.186.187

  QA_POINTING_BRANCH: qa
  QA_DOCKER_REGISTRY: 634937900606.dkr.ecr.ap-east-1.amazonaws.com/ga-vendor-api-service
  QA_DOCKER_TAG: qa
  QA_PORTAINER_NAME: game-aggregator_ga-vendor-api-service
  QA_SERVER: root@47.254.202.80

stages:
  - build
  - push-img
  - deploy

.stg-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $STG_POINTING_BRANCH

.qa-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $QA_POINTING_BRANCH

# stg ######################################
stg-gitlab-build:
  stage: build
  extends: .stg-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar

stg-push-dockerhub:
  stage: push-img
  needs: ["stg-gitlab-build"]
  extends: .stg-deploy-rule
  script:
    - docker build -t $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG .
    - docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password="$DOCKERHUB_PWD"
    - docker push $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG

stg-aws-deploy:
  stage: deploy
  needs: ["stg-push-dockerhub"]
  extends: .stg-deploy-rule
  script:
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG_SERVER -p 22 "docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

stg2-aws-deploy:
  stage: deploy
  needs: ["stg-push-dockerhub"]
  extends: .stg-deploy-rule
  script:
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG2_SERVER -p 22 "docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

stg3-1-aws-deploy:
  stage: deploy
  needs: ["stg-push-dockerhub"]
  extends: .stg-deploy-rule
  script:
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG3_SERVER_1 -p 22 "docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

stg3-2-aws-deploy:
  stage: deploy
  needs: ["stg-push-dockerhub"]
  extends: .stg-deploy-rule
  script:
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG3_SERVER_2 -p 22 "docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

# qa ######################################
qa-gitlab-build:
  stage: build
  extends: .qa-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar

qa-push-dockerhub:
  stage: push-img
  needs: ["qa-gitlab-build"]
  extends: .qa-deploy-rule
  script:
    - docker build -t $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG .
    - docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password="$DOCKERHUB_PWD"
    - docker push $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG

qa-ali-deploy:
  stage: deploy
  needs: ["qa-push-dockerhub"]
  extends: .qa-deploy-rule
  script:
    - echo "$CD_PRIVATE_KEY" > "$(pwd)/qa-key.pem"
    - chmod 400 "$(pwd)/qa-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/qa-key.pem" $QA_SERVER -p 22 "docker login $DOCKERHUB_URL--username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG && docker service update --force --image $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG $QA_PORTAINER_NAME"
