    - chmod 400 "$(pwd)/pt-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/pt-key.pem" $PT_SERVER -p 22 "docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PWD $REGISTRY_URL && docker pull $PT_DOCKER_REGISTRY:$PT_DOCKER_TAG && docker service update --force --image $PT_DOCKER_REGISTRY:$PT_DOCKER_TAG $PT_PORTAINER_NAME"
