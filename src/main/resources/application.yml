server:
  port: 8082
  http2:
    enabled: true
  tomcat:
    basedir: .. # pointing to parent folder, to be configured when deploying to server
    accesslog:
      enabled: true
    accept-count: 2500 # Maximum queue length for incoming connection requests when all possible request processing threads are in use.
    max-connections: 16384 # Default: 8192 (Maximum number of connections that the server accepts and processes at any given time.)
    #    max-threads: 4000
    #    min-spare-threads: 4000
    threads:
      min-spare: 150 # Default: 10 (Minimum amount of worker threads.)
      max: 150 # Default: 200 (Maximum amount of worker threads.)
mavenTimestamp: '@timestamp@'
version: '@project.version@'
checksumPath: target/game-aggregator-vendor-api-service-0.0.1-SNAPSHOT.jar
sas:
  enabled: false
spring:
  profiles:
    active: dev
  liquibase:
    enabled: false
  application:
    name: vendor-api-service
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
      resolve-lazily: true
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
    maria-default:
      driver-class-name: org.mariadb.jdbc.Driver
      jdbc-url:
      username:
      password:
  jpa:
    properties:
      hibernate:
        maria-dialect: org.hibernate.dialect.MariaDB103Dialect
        format_sql: false
  couchbase:
    connectionString: 
    userName: 
    password: 
    bucketName: 
    scopeName: 
  data:
    rest:
      detection-strategy: annotated
    redis:
      mode:
      nodehosts:
      database:
      host:
      port: 6379
      username:
      password:
      jedis:
        pool:
          max-idle: 30
          max-active: 100
          min-idle: 10
          max-wait: 2000
  kafka:
    properties:
      security:
        protocol: SASL_SSL
      client:
        dns:
          lookup: use_all_dns_ips
      sasl:
        mechanism: PLAIN
        jaas:
          config:
      bootstrap:
        servers: 
      session:
        timeout:
          ms: 45000
      basic:
        auth:
          credentials:
            source: "USER_INFO"
          user:
            info: 
      schema:
        registry:
          url:
springdoc:
  api-docs:
    path: /${spring.application.name}/v3/api-docs
  swagger-ui:
    path: /${spring.application.name}/swagger-ui.html
    tryItOutEnabled: true
  paths-to-match: /**
logging:
  http-request: true
logstash:
  host: 
  port: 
image:
  gameurl:
testing:
  stub: false
