.stg-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $STG_POINTING_BRANCH

.qa-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $QA_POINTING_BRANCH

.pt-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $PT_POINTING_BRANCH

# stg ######################################
stg-gitlab-build:
  stage: build
  extends: .stg-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 2d

stg-push-dockerhub:
  stage: push-img
  needs: ["stg-gitlab-build"]
  extends: .stg-deploy-rule
  script:
    - docker build -t $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG .
    - docker login --username=$DOCKERHUB_USERNAME --password="$DOCKERHUB_PWD"
    - docker push $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG

stg-aws-deploy:
  stage: deploy
  needs: ["stg-push-dockerhub"]
  extends: .stg-deploy-rule
  script:
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG_SERVER -p 22 "docker login --username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

# qa ######################################
qa-sonarqube-lint:
  stage: lint
  extends: .qa-deploy-rule
  # allow_failure: false
  script:
    - 'mvn clean verify sonar:sonar -Dsonar.projectKey=$SONAR_PROJECTKEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_LOGIN -DskipTests=true'

qa-gitlab-build:
  stage: build
  needs: ["qa-sonarqube-lint"]
  extends: .qa-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 2d

qa-push-dockerhub:
