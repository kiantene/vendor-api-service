.stg-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $STG_POINTING_BRANCH

.qa-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $QA_POINTING_BRANCH

.pt-deploy-rule:
  rules:
    - if: $CI_COMMIT_BRANCH == $PT_POINTING_BRANCH

# general ######################################
generate_pwd:
  stage: generate_pwd
  rules:
    - if: $CI_COMMIT_BRANCH == $STG_POINTING_BRANCH ||
          $CI_COMMIT_BRANCH == $QA_POINTING_BRANCH ||
          $CI_COMMIT_BRANCH == $PT_POINTING_BRANCH
  script:
    - aws configure set aws_access_key_id $ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $SECRET_ACCESS_KEY
    - aws configure set region $DEFAULT_REGION
    - aws ecr get-login-password --region ap-east-1 > ./pwd.txt
  artifacts:
    paths:
      - pwd.txt
    expire_in: 1 h

# stg ######################################
stg-gitlab-build:
  stage: build
  extends: .stg-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 2d

stg-push-registry:
  stage: push-img
  needs:
    - job: generate_pwd
      artifacts: true
    - job: stg-gitlab-build
  extends: .stg-deploy-rule
  script:
    - export REGISTRY_PWD=$(cat pwd.txt)
    - docker build -t $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG .
    - docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PWD $REGISTRY_URL
    - docker push $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG

stg-aws-deploy:
  stage: deploy
  needs:
    - job: generate_pwd
      artifacts: true
    - job: stg-push-registry
  extends: .stg-deploy-rule
  script:
    - export REGISTRY_PWD=$(cat pwd.txt)
    - echo "$CD_AWS_PRIVATE_KEY" > "$(pwd)/stg-key.pem"
    - chmod 400 "$(pwd)/stg-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/stg-key.pem" $STG_SERVER -p 22 "docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PWD $REGISTRY_URL && docker pull $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG && docker service update --force --image $STG_DOCKER_REGISTRY:$STG_DOCKER_TAG $STG_PORTAINER_NAME"

# qa ######################################
qa-sonarqube-lint:
  stage: lint
  extends: .qa-deploy-rule
  # allow_failure: false
  script:
    - 'mvn clean verify sonar:sonar -Dsonar.projectKey=$SONAR_PROJECTKEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_LOGIN -DskipTests=true'

qa-gitlab-build:
  stage: build
  needs: ["qa-sonarqube-lint"]
  extends: .qa-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 2d

qa-push-registry:
  stage: push-img
  needs:
    - job: generate_pwd
      artifacts: true
    - job: qa-gitlab-build
  extends: .qa-deploy-rule
  script:
    - export REGISTRY_PWD=$(cat pwd.txt)
    - docker build -t $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG .
    - docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PWD $REGISTRY_URL
    - docker push $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG

qa-ali-deploy:
  stage: deploy
  needs:
    - job: generate_pwd
      artifacts: true
    - job: qa-push-registry
  extends: .qa-deploy-rule
  script:
    - export REGISTRY_PWD=$(cat pwd.txt)
    - echo "$CD_PRIVATE_KEY" > "$(pwd)/qa-key.pem"
    - chmod 400 "$(pwd)/qa-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/qa-key.pem" $QA_SERVER -p 22 "docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PWD $REGISTRY_URL && docker pull $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG && docker service update --force --image $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG $QA_PORTAINER_NAME"

qa-automated-testing:
  stage: automated_test
  needs: ["qa-ali-deploy"]
  extends: .qa-deploy-rule
  script:
    - nohup $(sleep 60 && curl --location 'http://223.25.67.48:8080/job/GA-vendor-integration-tests/build?token=gameaggregator') > /dev/null 2>&1 &

# pt ######################################
pt-gitlab-build:
  stage: build
  extends: .pt-deploy-rule
  script:
    - "mvn clean deploy -s ./ci_setting.xml -DskipTests=true"
  artifacts:
