  needs: ["qa-gitlab-build"]
  extends: .qa-deploy-rule
  script:
    - docker build -t $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG .
    - docker login --username=$DOCKERHUB_USERNAME --password="$DOCKERHUB_PWD"
    - docker push $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG

qa-ali-deploy:
  stage: deploy
  needs: ["qa-push-dockerhub"]
  extends: .qa-deploy-rule
  script:
    - echo "$CD_PRIVATE_KEY" > "$(pwd)/qa-key.pem"
    - chmod 400 "$(pwd)/qa-key.pem"
    - ssh -t -oStrictHostKeyChecking=no -i "$(pwd)/qa-key.pem" $QA_SERVER -p 22 "docker login --username=$DOCKERHUB_USERNAME --password=$DOCKERHUB_PWD && docker pull $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG && docker service update --force --image $QA_DOCKER_REGISTRY:$QA_DOCKER_TAG $QA_PORTAINER_NAME"

