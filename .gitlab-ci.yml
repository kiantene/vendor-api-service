  REGISTRY_USERNAME: AWS

  SONAR_PROJECTKEY: game-aggregator
  SONAR_HOST_URL: http://223.25.67.48:9000
  SONAR_LOGIN: b614da09216500ab03ce35984a4004934576d4e8

  STG_POINTING_BRANCH: staging
  STG_DOCKER_REGISTRY: 634937900606.dkr.ecr.ap-east-1.amazonaws.com/ga-vendor-api-service
  STG_DOCKER_TAG: stg
  STG_PORTAINER_NAME: game-aggregator_ga-vendor-api-service
  STG_SERVER: ubuntu@16.163.185.163 # stg.gasea168.com

