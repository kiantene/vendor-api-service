spring.profiles.active=dev

server.port=8082
server.http2.enabled=true
server.tomcat.accept-count=2500
server.tomcat.max-connections=16384
server.tomcat.threads.min-spare=150
server.tomcat.threads.max=150
server.servlet.context-path=/

version=@project.version@
sas.enabled=false

spring.liquibase.enabled=false
spring.application.name=vendor-api-service
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
spring.servlet.multipart.resolve-lazily=true

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=15
spring.datasource.maria-default.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.game-aggregator-service-reader.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.wallet-service-writer.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.wallet-service-reader.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.maria-dialect=org.hibernate.dialect.MariaDBDialect

spring.data.rest.detection-strategy=annotated

spring.data.redis.mode=
spring.data.redis.nodehosts=
spring.data.redis.port=6379
spring.data.redis.jedis.pool.max-idle=30
spring.data.redis.jedis.pool.max-active=100
spring.data.redis.jedis.pool.min-idle=10
spring.data.redis.jedis.pool.max-wait=2000

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.session.timeout.ms=45000
spring.kafka.properties.basic.auth.credentials.source=USER_INFO

springdoc.api-docs.path=/${spring.application.name}/v3/api-docs
springdoc.swagger-ui.path=/${spring.application.name}/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.paths-to-match=/**

logging.config=classpath:logback-spring.xml
logging.process-time=false
